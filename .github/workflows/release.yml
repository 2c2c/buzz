name: Release

# Push a tag like v0.1.0 to build the app and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app, disk image and tarball
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-dev"
          fi
          Scripts/build-dmg.sh

      - name: Check the built binary runs
        run: dist/Buzz.app/Contents/MacOS/buzz --help

      - name: Keep build output
        uses: actions/upload-artifact@v4
        with:
          name: buzz
          path: |
            dist/*.dmg
            dist/*.tar.gz

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.tar.gz \
            --title "Buzz ${GITHUB_REF_NAME#v}" --generate-notes
